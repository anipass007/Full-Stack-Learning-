<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store - Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>

<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 font-sans antialiased">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="container mx-auto px-4 h-16 flex items-center justify-between gap-4">

      <a href="index.html" class="flex items-center gap-2 text-xl font-bold tracking-tight text-slate-900 shrink-0">
        <svg class="w-6 h-6 text-teal-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"
          xmlns="http://www.w3.org/2000/svg">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path>
        </svg>
        <span>Store</span>
      </a>

      <div class="flex-1 max-w-md mx-2 sm:mx-6">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
          </span>
          <input type="text" id="search-input" placeholder="Search products..."
            class="w-full pl-9 pr-4 py-1.5 text-sm bg-slate-100 border border-slate-300 rounded-md focus:outline-none focus:ring-1 focus:ring-teal-700 focus:border-teal-700 transition">
        </div>
      </div>

      <nav class="flex items-center gap-5 text-sm font-medium shrink-0">
        <a href="index.html" class="text-teal-700 font-semibold hover:text-teal-800 transition">Home</a>
        <a href="wishlist.html" class="text-slate-600 hover:text-teal-700 transition flex items-center gap-1.5">
          <span>Wishlist</span>
          <span id="wishlist-count"
            class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">2</span>
        </a>
        <a href="cart.html" class="text-slate-600 hover:text-teal-700 transition flex items-center gap-1.5">
          <span>Cart</span>
          <span id="cart-count"
            class="inline-flex items-center justify-center px-2 py-0.5 text-xs font-semibold text-white bg-teal-700 rounded-full">3</span>
        </a>
      </nav>

    </div>
  </header>

  <section class="bg-slate-100 border-b border-slate-200 py-12 px-4">
    <div class="container mx-auto text-center max-w-2xl">
      <h1 class="text-3xl sm:text-4xl font-bold text-slate-900 tracking-tight">Everyday Essentials</h1>
      <p class="mt-3 text-slate-600 text-base sm:text-lg">Discover our curated collection of quality products at honest
        prices.</p>
    </div>
  </section>

  <main id="shop" class="flex-grow container mx-auto px-4 py-8">

    <section class="mb-8" aria-label="Category Filters">
      <div id="category-filters" class="flex flex-wrap items-center gap-2">
        <!-- Categories buttons dynamically created and rendered hai -->

          </div>
    </section>

    <section aria-label="Product Catalog">
      <div id="products-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
        <!-- Product are generated dynamically -->
      </div>
    </section>

  </main>

  <footer class="bg-white border-t border-slate-200 py-6 mt-auto">
    <div class="container mx-auto px-4 text-center text-sm text-slate-500">
      <p>©  2026 Store. All rights reserved.</p>
    </div>
  </footer>

</body>

</html>
